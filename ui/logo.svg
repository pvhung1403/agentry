<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7C6CFF"/>
      <stop offset="1" stop-color="#3A28D4"/>
    </linearGradient>
    <linearGradient id="top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E6E2FF"/>
    </linearGradient>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#160A66" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Squircle tile, inset like a macOS app icon -->
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>
  <!-- Lower layers: what is already loaded -->
  <g fill="none" stroke="#FFFFFF" stroke-width="46" stroke-linecap="round" stroke-linejoin="round">
    <path d="M262 600 L512 725 L762 600" stroke-opacity="0.42"/>
    <path d="M262 510 L512 635 L762 510" stroke-opacity="0.7"/>
  </g>
  <!-- Top layer -->
  <path d="M512 295 L762 420 L512 545 L262 420 Z" fill="url(#top)" stroke="#FFFFFF" stroke-width="46"
        stroke-linejoin="round" filter="url(#lift)"/>
  <!-- AI spark -->
  <path d="M738 205 C749 258 762 271 815 282 C762 293 749 306 738 359 C727 306 714 293 661 282 C714 271 727 258 738 205 Z"
        fill="#FFD166"/>
</svg>
